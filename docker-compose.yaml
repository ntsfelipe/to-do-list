
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      REDIS_HOST: redis
      INSTANCE_ID: api-1

  api-2:
    build: .
    environment:
      REDIS_HOST: redis
      INSTANCE_ID: api-2

  nginx:
    image: nginx:latest
    ports: 
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
